<meta name="apple-mobile-web-app-title" content="Hola Familia">
<meta name="theme-color" content="#1f4fa3">

<title>Hola Familia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Lalezar&family=Vazirmatn:wght@400;600;800&display=swap">
<style>
/* Layout: one phone-width column; topics are glazed azulejo tiles on a whitewashed wall, progress is a train route across Spanish cities. */
:root{
  --wall:#f6f4ef; --tile:#ffffff; --ink:#1d2433; --soft:#5b6476; --line:#dfe3ea;
  --cobalt:#1f4fa3; --cobalt-soft:#e3eaf7; --saffron:#e3a21a; --saffron-soft:#fbefd2;
  --olive:#5f7a2e; --ok:#2f7d4f; --ok-bg:#e2f2e8; --bad:#b4392f; --bad-bg:#f8e1de;
  --on-accent:#ffffff;
  --fa:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  --fa-display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --es:'Fraunces',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#141924; --tile:#1d2433; --ink:#eef1f6; --soft:#a5aec0; --line:#2e3748;
  --cobalt:#7fa6f0; --cobalt-soft:#22314f; --saffron:#f0b840; --saffron-soft:#3a3018;
  --olive:#a7c46a; --ok:#7fd4a0; --ok-bg:#1d3a2a; --bad:#f2928a; --bad-bg:#43211e; --on-accent:#10141d; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#141924; --tile:#1d2433; --ink:#eef1f6; --soft:#a5aec0; --line:#2e3748;
  --cobalt:#7fa6f0; --cobalt-soft:#22314f; --saffron:#f0b840; --saffron-soft:#3a3018;
  --olive:#a7c46a; --ok:#7fd4a0; --ok-bg:#1d3a2a; --bad:#f2928a; --bad-bg:#43211e; --on-accent:#10141d; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--wall)}
body{background:var(--wall);color:var(--ink);font:16px/1.75 var(--fa);direction:rtl}
.app{max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
.es{font-family:var(--es);direction:ltr;unicode-bidi:isolate}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--wall);display:flex;align-items:center;gap:8px;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.who{display:flex;align-items:center;gap:8px;background:var(--tile);border:1.5px solid var(--line);border-radius:99px;padding:4px 12px 4px 6px;font-weight:600}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--cobalt-soft);display:grid;place-items:center;font-size:18px}
.pill{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:99px;background:var(--saffron-soft);color:var(--ink);font-size:15px}
.spacer{flex:1}
.iconbtn{border:0;background:transparent;font-size:20px;padding:6px;border-radius:10px}

/* Home */
.hello{display:grid;gap:4px;margin-bottom:14px}
.hello h1{font-family:var(--fa-display);font-weight:400;font-size:clamp(28px,7vw,38px);letter-spacing:.01em}
.hello h1 .es{font-family:var(--es);font-weight:800;color:var(--cobalt)}
.hello p{color:var(--soft)}
.hello p.gift{color:var(--cobalt);font-weight:600;font-size:15px;background:var(--cobalt-soft);border-radius:12px;padding:8px 12px;justify-self:start}
.signoff{text-align:center;color:var(--soft);font-size:13px;margin-top:22px}
.goal{display:flex;align-items:center;gap:14px;background:var(--tile);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--saffron) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--tile);display:grid;place-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.goal .t{flex:1;min-width:0}
.goal .t h3{font-size:16px}
.goal .t p{color:var(--soft);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:800;background:var(--cobalt);color:var(--on-accent)}
.btn.alt{background:var(--tile);color:var(--cobalt);border:1.5px solid var(--cobalt)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}

/* Route of cities */
.route{background:var(--tile);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:16px}
.route h3{font-size:14px;color:var(--soft);font-weight:600;margin-bottom:8px}
.track{display:flex;align-items:center;overflow-x:auto;padding-bottom:4px;direction:ltr;scrollbar-width:thin}
.stop{display:grid;justify-items:center;gap:2px;flex:none;width:62px}
.stop i{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--tile)}
.stop.done i{background:var(--saffron);border-color:var(--saffron)}
.stop span{font-family:var(--es);font-size:11px;color:var(--soft)}
.stop.done span{color:var(--ink);font-weight:600}
.rail{flex:none;width:18px;height:3px;background:var(--line);margin-bottom:18px}
.rail.done{background:var(--saffron)}

/* Azulejo tiles */
.sectionlabel{font-size:13px;letter-spacing:.04em;color:var(--soft);font-weight:600;margin:4px 2px 8px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.tilebtn{position:relative;text-align:right;border:0;border-radius:16px;padding:14px;background:var(--tile);box-shadow:0 0 0 1px var(--line) inset;display:grid;gap:6px;min-height:132px;overflow:hidden}
.tilebtn::before{content:"";position:absolute;inset:auto -18px -18px auto;width:84px;height:84px;opacity:.16;
  background:radial-gradient(circle at 50% 50%,var(--cobalt) 0 14%,transparent 15%),
    conic-gradient(from 45deg,var(--cobalt) 0 25%,transparent 0 50%,var(--cobalt) 0 75%,transparent 0);border-radius:12px;transform:rotate(12deg)}
.tilebtn .em{font-size:30px;line-height:1}
.tilebtn h3{font-size:16px;font-weight:800}
.tilebtn .es{font-size:14px;color:var(--cobalt);font-weight:600}
.stars{display:flex;gap:2px;font-size:14px;letter-spacing:1px;color:var(--saffron)}
.stars .off{color:var(--line)}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.extras .tilebtn{min-height:auto;background:var(--cobalt-soft);box-shadow:none}
.extras .tilebtn::before{display:none}

/* Learn cards */
.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.head h2{font-size:20px;font-weight:800;flex:1;min-width:0}
.back{border:1.5px solid var(--line);background:var(--tile);border-radius:12px;padding:6px 12px;font-weight:600}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.dots i{flex:1;min-width:8px;height:6px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--cobalt)}
.card{background:var(--tile);border-radius:22px;box-shadow:0 0 0 1px var(--line) inset;padding:26px 18px;display:grid;justify-items:center;gap:10px;text-align:center;margin-bottom:14px}
.card .pic{font-size:64px;line-height:1.1}
.card .word{font-size:clamp(30px,8vw,42px);font-weight:800;color:var(--cobalt);line-height:1.2}
.card .pron{font-size:18px;color:var(--soft)}
.card .mean{font-size:20px;font-weight:600}
.say{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--cobalt);color:var(--cobalt);background:transparent;border-radius:99px;padding:8px 16px;font-weight:600}
.sbtn svg{width:20px;height:20px}
.nav{display:flex;gap:10px}
.nav .btn{flex:1}

/* Quiz */
.q{background:var(--tile);border-radius:22px;box-shadow:0 0 0 1px var(--line) inset;padding:20px 16px;display:grid;gap:14px;margin-bottom:14px}
.q .ask{font-size:14px;color:var(--soft);font-weight:600}
.q .prompt{font-size:clamp(24px,6.5vw,32px);font-weight:800;text-align:center}
.q .prompt.es{color:var(--cobalt)}
.q .big{display:flex;justify-content:center}
.choices{display:grid;gap:10px}
.choice{border:1.5px solid var(--line);background:var(--wall);border-radius:14px;padding:12px 14px;text-align:right;font-weight:600;font-size:17px;display:flex;align-items:center;gap:10px}
.choice .es{font-size:18px}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.bad{border-color:var(--bad);background:var(--bad-bg)}
.build{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:ltr;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.chip{border:1.5px solid var(--cobalt);background:var(--tile);color:var(--ink);border-radius:12px;padding:6px 12px;font-family:var(--es);font-size:18px;font-weight:600}
.chip.used{visibility:hidden}
.feedback{border-radius:14px;padding:12px 14px;font-weight:600;display:grid;gap:4px}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback .es{color:var(--ink)}

/* Result */
.result{display:grid;justify-items:center;gap:12px;text-align:center;padding:20px 8px}
.result .bigstars{font-size:48px;letter-spacing:6px;color:var(--saffron)}
.result .bigstars .off{color:var(--line)}
.result h2{font-family:var(--fa-display);font-weight:400;font-size:32px}
.result p{color:var(--soft)}

/* Phrasebook / sounds */
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--tile);border-radius:14px;box-shadow:0 0 0 1px var(--line) inset;padding:10px 12px}
.row .txt{flex:1;min-width:0;display:grid}
.row .es{font-size:18px;font-weight:600;color:var(--cobalt)}
.row small{color:var(--soft);font-size:14px}
.row .pic{font-size:26px}
.play{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center}
.play svg{width:20px;height:20px}
.note{background:var(--saffron-soft);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.sound{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;background:var(--tile);border-radius:14px;box-shadow:0 0 0 1px var(--line) inset;padding:12px 14px}
.sound .l{font-family:var(--es);font-weight:800;font-size:28px;color:var(--cobalt);grid-row:span 2;min-width:56px;text-align:center}
.sound small{color:var(--soft)}

/* Family */
.members{display:grid;gap:10px;margin-bottom:14px}
.member{display:flex;align-items:center;gap:12px;background:var(--tile);border-radius:14px;box-shadow:0 0 0 1px var(--line) inset;padding:10px 12px;border:0;text-align:right;width:100%}
.member.on{box-shadow:0 0 0 2px var(--cobalt) inset}
.member .av{width:42px;height:42px;border-radius:50%;background:var(--cobalt-soft);display:grid;place-items:center;font-size:24px}
.member .t{flex:1;min-width:0;display:grid}
.member small{color:var(--soft)}
.addform{display:grid;gap:10px;background:var(--tile);border-radius:16px;box-shadow:0 0 0 1px var(--line) inset;padding:14px}
.addform input{font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--wall);color:var(--ink)}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:var(--cobalt-soft);font-size:22px}
.avs button[aria-pressed="true"]{border-color:var(--cobalt)}
.voicewarn{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
</style>

</head>

function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.members&&s.members.length)return s}catch(e){}

function M(){return S.members[S.cur]||S.members[0]}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function streak(m){var set={};(m.days||[]).forEach(function(d){set[d]=1});var n=0,d=new Date();
  if(!set[todayStr()])d.setDate(d.getDate()-1);
  for(;;){var k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();if(set[k]){n++;d.setDate(d.getDate()-1)}else break}return n}
function totalStars(m){var t=0;for(var k in m.stars)t+=m.stars[k];return t}
function markDay(m){var t=todayStr();if(m.days.indexOf(t)<0)m.days.push(t);if(m.days.length>400)m.days=m.days.slice(-400);
  if(m.today.d!==t)m.today={d:t,n:0};m.today.n++}

var VOICE=null,HASVOICE=true;
function pickVoice(){if(!('speechSynthesis' in window)){HASVOICE=false;return}
  var vs=speechSynthesis.getVoices();if(!vs.length)return;
  VOICE=vs.find(function(v){return v.lang==='es-ES'||v.lang==='es_ES'})||vs.find(function(v){return /^es/i.test(v.lang)})||null;
  HASVOICE=!!VOICE}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}else HASVOICE=false;
function say(t,slow){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t.replace(/…/g,''));u.lang='es-ES';if(VOICE)u.voice=VOICE;u.rate=slow?0.6:0.9;speechSynthesis.speak(u)}catch(e){}}

  return items.map(function(it,k){var words=it[0].replace(/[¿?¡!,.…]/g,' ').trim().split(/\s+/);

    var type=types[(k+Math.floor(Math.random()*types.length))%types.length];
    var others=shuffle(T.items.filter(function(x){return x!==it})).slice(0,3);
    return {it:it,type:type,opts:shuffle([it].concat(others)),words:words}})}

      '<div class="choices">'+q.opts.map(function(o,k){return '<button class="choice" data-k="'+k+'"><span class="es">'+esc(o[0])+'</span></button>'}).join('')+'</div>';
    if(q.type==='listen')body='<div class="ask">گوش کن و درست را انتخاب کن</div><div class="big say"><button class="sbtn" id="s1" style="font-size:18px;padding:14px 26px">'+SPK+' دوباره پخش کن</button><button class="sbtn" id="s2">'+SLOW+' آهسته</button></div>'+
      '<div class="choices">'+q.opts.map(function(o,k){return '<button class="choice" data-k="'+k+'"><span class="es">'+esc(o[0])+'</span></button>'}).join('')+'</div>';
    if(q.type==='build'){var bank=shuffle(q.words.map(function(w,k){return {w:w,k:k}}));
      body='<div class="ask">جمله را بساز: «'+esc(it[1])+'»</div><div class="build" id="bd" aria-live="polite"></div><div class="bank" id="bn">'+bank.map(function(b,k){return '<button class="chip" data-b="'+k+'">'+esc(b.w)+'</button>'}).join('')+'</div>'+
        '<div class="nav"><button class="btn alt" id="clr">پاک کن</button><button class="btn" id="chk" disabled>بررسی</button></div>';q.bank=bank}
    app.innerHTML=head+'<div class="q pop">'+body+'<div id="fb"></div></div>';
    wireBar();document.getElementById('bk').onclick=home;
    var s1=document.getElementById('s1');if(s1)s1.onclick=function(){say(it[0])};var s2=document.getElementById('s2');if(s2)s2.onclick=function(){say(it[0],true)};
    if(q.type==='listen'||q.type==='es2fa')say(it[0]);
    if(q.type==='build'){var picked=[];var bd=document.getElementById('bd'),chk=document.getElementById('chk');
      function draw(){bd.innerHTML=picked.map(function(p,k){return '<button class="chip" data-p="'+k+'">'+esc(q.bank[p].w)+'</button>'}).join('');chk.disabled=picked.length!==q.words.length;
        app.querySelectorAll('#bn .chip').forEach(function(c){c.classList.toggle('used',picked.indexOf(+c.dataset.b)>=0)})}
      app.querySelectorAll('#bn .chip').forEach(function(c){c.onclick=function(){var b=+c.dataset.b;if(picked.indexOf(b)<0){picked.push(b);draw()}}});
      bd.onclick=function(e){var c=e.target.closest('[data-p]');if(c){picked.splice(+c.dataset.p,1);draw()}};
      document.getElementById('clr').onclick=function(){picked=[];draw()};
      chk.onclick=function(){var ans=picked.map(function(p){return q.bank[p].w}).join(' ');var ok=ans===q.words.join(' ');finish(ok);chk.disabled=true;document.getElementById('clr').disabled=true}}
    else app.querySelectorAll('.choice').forEach(function(b){b.onclick=function(){var o=q.opts[+b.dataset.k];var ok=o===it;
      app.querySelectorAll('.choice').forEach(function(x){x.disabled=true;if(q.opts[+x.dataset.k]===it)x.classList.add('ok')});if(!ok)b.classList.add('bad');finish(ok)}});
    window.scrollTo(0,0)}
  function finish(ok){var it=Q[qi].it;if(!ok)mistakes++;
    var fb=document.getElementById('fb');fb.innerHTML='<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'آفرین! درست بود.':'اشکالی ندارد، جواب درست این بود:')+
      '<span class="es">'+esc(it[0])+'</span><span>'+esc(it[2])+' · '+esc(it[1])+'</span></div><button class="btn wide" id="nq" style="margin-top:10px">'+(qi<Q.length-1?'بعدی':'دیدن نتیجه')+'</button>';
    if(ok)say(it[0]);document.getElementById('nq').onclick=function(){qi++;if(qi<Q.length)show();else result()};document.getElementById('nq').focus()}
  function result(){var stars=mistakes===0?3:mistakes<=2?2:1;var m=M();var prev=m.stars[id]||0;m.stars[id]=Math.max(prev,stars);m.xp+=10*stars;markDay(m);save();
    var nextT=TOPICS[(TOPICS.indexOf(T)+1)%TOPICS.length];
    app.innerHTML=bar()+'<div class="result pop">'+starHtml(stars,'bigstars')+'<h2>'+(stars===3?'¡Perfecto! عالی بود':stars===2?'¡Muy bien! خیلی خوب':'¡Bien! ادامه بده')+'</h2>'+
     '<p>'+fa(Q.length-mistakes)+' جواب درست از '+fa(Q.length)+'. شهر <span class="es">'+T.city+'</span> در سفر شما روشن شد.</p>'+
     '<div class="nav" style="width:100%"><button class="btn alt" id="again">دوباره</button><button class="btn" id="nt">درس بعد: '+esc(nextT.fa)+'</button></div>'+
     '<button class="back" id="hm">صفحه اصلی</button></div>';
    wireBar();document.getElementById('again').onclick=function(){quiz(id)};document.getElementById('nt').onclick=function(){learn(nextT.id)};document.getElementById('hm').onclick=home;
    if(stars===3)confetti()}
  show()}

/* ---------- Phrasebook & sounds ---------- */
function rows(list){return '<div class="list">'+list.map(function(x,k){return '<div class="row"><span class="pic" aria-hidden="true">'+x[3]+'</span><div class="txt"><span class="es">'+esc(x[0])+'</span><small>'+esc(x[2])+' · '+esc(x[1])+'</small></div><button class="play" data-k="'+k+'" aria-label="پخش">'+SPK+'</button></div>'}).join('')+'</div>'}
function emergency(){app.innerHTML=bar()+voiceWarn()+'<div class="head"><button class="back" id="bk">بازگشت</button><h2>جمله‌های ضروری</h2></div>'+
  '<div class="note">شماره اورژانس در اسپانیا و همه اروپا <b>۱۱۲</b> است؛ رایگان و شبانه‌روزی. اپراتورها معمولاً انگلیسی هم صحبت می‌کنند.</div>'+rows(EMERGENCY);
  wireBar();document.getElementById('bk').onclick=home;app.querySelectorAll('.play').forEach(function(b){b.onclick=function(){say(EMERGENCY[+b.dataset.k][0])}});window.scrollTo(0,0)}
function sounds(){app.innerHTML=bar()+voiceWarn()+'<div class="head"><button class="back" id="bk">بازگشت</button><h2>صداهای اسپانیایی</h2></div>'+
  '<div class="note">اسپانیایی تقریباً همان‌طور خوانده می‌شود که نوشته می‌شود. این چند حرف با فارسی و انگلیسی فرق دارند. روی هر مثال بزنید تا بشنوید.</div><div class="list">'+
  SOUNDS.map(function(x,k){return '<button class="sound" data-k="'+k+'" style="border:0;text-align:right;width:100%"><span class="l">'+esc(x[0])+'</span><b>'+esc(x[1])+'</b><small><span class="es">'+esc(x[2])+'</span> ← '+esc(x[3])+'</small></button>'}).join('')+'</div>';
  wireBar();document.getElementById('bk').onclick=home;app.querySelectorAll('.sound').forEach(function(b){b.onclick=function(){say(SOUNDS[+b.dataset.k][2].replace('،',','))}});window.scrollTo(0,0)}

/* ---------- Family members ---------- */
var AVS=['🧑','👩','👨','👧','👦','👵','👴','🐱','🦊','🐻','🦁','🐼'];
function family(){var sel=AVS[3];
  app.innerHTML=bar()+'<div class="head"><button class="back" id="bk">بازگشت</button><h2>اعضای خانواده</h2></div>'+
   '<p style="color:var(--soft);margin-bottom:12px">هر نفر ستاره‌ها و پیشرفت خودش را دارد. روی اسم بزنید تا با آن ادامه دهید.</p>'+
   '<div class="members">'+S.members.map(function(m,k){return '<button class="member'+(k===S.cur?' on':'')+'" data-m="'+k+'"><span class="av">'+esc(m.av)+'</span><span class="t"><b>'+esc(m.name)+'</b><small>★ '+fa(totalStars(m))+' · 🔥 '+fa(streak(m))+' روز</small></span></button>'}).join('')+'</div>'+
   '<form class="addform" id="af"><b>افزودن عضو جدید</b><label for="nm" style="font-size:14px;color:var(--soft)">اسم</label><input id="nm" maxlength="20" placeholder="مثلاً سارا" autocomplete="off">'+
   '<div class="avs" role="group" aria-label="انتخاب تصویر">'+AVS.map(function(a){return '<button type="button" aria-pressed="'+(a===sel)+'" data-a="'+a+'">'+a+'</button>'}).join('')+'</div>'+
   '<button class="btn" type="submit">افزودن</button></form>';
  wireBar();document.getElementById('bk').onclick=home;
  app.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){S.cur=+b.dataset.m;save();home()}});
  app.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){sel=b.dataset.a;app.querySelectorAll('[data-a]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});
  document.getElementById('af').onsubmit=function(e){e.preventDefault();var n=document.getElementById('nm').value.trim();if(!n){document.getElementById('nm').focus();return}
    S.members.push({name:n,av:sel,stars:{},seen:{},xp:0,days:[],today:{d:'',n:0}});S.cur=S.members.length-1;save();home()};window.scrollTo(0,0)}

/* ---------- Celebration ---------- */
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;var c=document.getElementById('fx'),x=c.getContext('2d');
  c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
  var cs=getComputedStyle(document.documentElement),cols=[cs.getPropertyValue('--saffron'),cs.getPropertyValue('--cobalt'),cs.getPropertyValue('--olive'),cs.getPropertyValue('--bad')];
  var P=[];for(var i=0;i<90;i++)P.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*9,vy:Math.random()*-9-3,s:4+Math.random()*5,c:cols[i%4],r:Math.random()*6});
  var t=0;(function f(){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(function(p){p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++t<110)requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)})()}

home();
</script>
